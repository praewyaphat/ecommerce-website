<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – Product Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome (ยังใช้ของคุณ) -->
  <link rel="stylesheet" href="css/font-awesome.min.css">

  <!-- Custom style ของโปรเจกต์ -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header (copy มาจาก index.html) -->
  <header class="header py-3">
    <div class="container d-flex align-items-center">
      <a href="index.html" class="me-auto">
        <img src="img/logo.png" alt="Logo" height="40">
      </a>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin.html">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Admin Section -->
  <section class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Product Management</h2>
        <button id="btn-add" class="btn btn-dark">Add New Product</button>
      </div>

      <table class="table table-striped">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Price (฿)</th>
            <th>Category</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="product-table">
          <!-- เติมด้วย JS -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- Modal สำหรับ Add/Edit -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="productForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalLabel">New Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="prod-id">
          <div class="mb-3">
            <label for="prod-name" class="form-label">Name</label>
            <input type="text" id="prod-name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="prod-price" class="form-label">Price</label>
            <input type="number" id="prod-price" class="form-control" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="prod-cat" class="form-label">Category</label>
            <input type="text" id="prod-cat" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="prod-img" class="form-label">Image Path</label>
            <input type="text" id="prod-img" class="form-control" placeholder="e.g. img/product-1.jpg" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-dark">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer (copy มาจาก template เดิม ปรับ background ให้เข้ากับหน้า Admin) -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">© <script>document.write(new Date().getFullYear())</script> Your Shop. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap Bundle (Popper+JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery (ถ้า admin.js ยังใช้) -->
  <script src="js/jquery-3.3.1.min.js"></script>
  <!-- Admin logic -->
  <script src="js/admin.js"></script>
</body>
</html>
